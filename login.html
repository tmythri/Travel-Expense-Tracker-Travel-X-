<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelX - Log In</title>
    <link rel="stylesheet" href="style.css?v=1.0.1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="theme.js"></script>
</head>
<body>
    <!-- Background Decoration -->
    <div class="orb orb-primary"></div>
    <div class="orb orb-secondary"></div>

    <div class="auth-container">
        <div class="auth-box glass">
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="logo-icon bi bi-compass" style="font-size: 32px;"></i>
                    <span class="logo-text" style="font-size: 26px;">TravelX</span>
                </div>
                <h2 class="auth-title">Welcome Back</h2>
                <p class="auth-subtitle">Access your travel wallets and stats</p>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input class="form-control" type="email" id="email" required placeholder="name@example.com">
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input class="form-control" type="password" id="password" required placeholder="••••••••">
                </div>
                <button class="btn btn-primary" type="submit" style="width: 100%; justify-content: center; margin-top: 10px;">
                    Log In <i class="bi bi-box-arrow-in-right"></i>
                </button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a class="auth-link" href="register.html">Sign Up</a>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="components.js?v=1.0.2"></script>
    <script src="auth.js?v=1.0.2"></script>
    <script>
        document.getElementById("login-form").addEventListener("submit", (e) => {
            e.preventDefault();
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            const res = loginUser(email, password);
            if (res.success) {
                showToast(res.message, "success");
                setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 1000);
            } else {
                showToast(res.message, "error");
            }
        });
    </script>
</body>
</html>
